<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení | FinAnalyzer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }

        h1 { color: var(--text-main); margin-bottom: 0.5rem; font-size: 1.75rem; }
        p { color: var(--text-muted); margin-bottom: 2rem; }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        button {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="login-card">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🏛️</div>
    <h1>FinAnalyzer v2.0</h1>
    <p>Zadejte své jméno pro přístup k historii</p>
    <form method="POST">
        <input type="text" name="jmeno" placeholder="Vaše jméno" style="width: 100%; box-sizing: border-box; text-align: center; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;" required>
        <button type="submit">Vstoupit do aplikace</button>
    </form>
</div>

</body>
</html>
